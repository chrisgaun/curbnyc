name: Verify Pages release
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'github-pages' &&
       (github.event.deployment.ref == 'main' || github.event.deployment.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public assets against checkout
        run: |
          for attempt in 1 2 3; do
            if node scripts/check-pages-release.mjs; then exit 0; fi
            if [ "$attempt" != 3 ]; then sleep 8; fi
          done
          exit 1
