name: Refresh meter inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 2 * *'
  push:
    paths:
      - '.github/workflows/meters.yml'
      - 'scripts/sync_meters.py'
permissions:
  contents: write
concurrency:
  group: meter-inventory
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_meters.py
      - name: Publish snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/meters.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh NYC meter data"
          git pull --rebase
          git push
